<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinbox Mining - Generador de Recibos</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ============================================================
           FORMULARIO
           ============================================================ */
        #formulario {
            width: 100%;
            max-width: 600px;
            background: #1a1a1a;
            border-radius: 14px;
            padding: 36px 32px;
        }

        #formulario h1 {
            text-align: center;
            color: #F5A623;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
        }

        /* Labels del formulario */
        .f-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Inputs base */
        .f-input, .f-select {
            width: 100%;
            padding: 10px 12px;
            background: #2a2a2a;
            border: 1.5px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .f-input:focus, .f-select:focus { border-color: #F5A623; }
        .f-input.error, .f-select.error { border-color: #e74c3c; }

        .f-select option { background: #2a2a2a; color: #fff; }

        /* Fila de fecha + nombre */
        .f-row {
            display: flex;
            gap: 16px;
            margin-bottom: 22px;
        }

        .f-col { flex: 1; }

        /* Radio buttons tipo de pago */
        .f-radios {
            display: flex;
            gap: 24px;
            margin-bottom: 22px;
        }

        .f-radios label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }

        .f-radios input[type="radio"] {
            accent-color: #F5A623;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Seccion items */
        .f-items-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            margin-top: 6px;
        }

        .f-items-title span {
            font-size: 13px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Cada fila de item */
        .f-item {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 12px;
            padding: 14px;
            background: #222;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .f-item .fi-col { display: flex; flex-direction: column; }
        .f-item .fi-col label {
            font-size: 11px;
            color: #777;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .f-item .fi-modelo { flex: 2; }
        .f-item .fi-custom { flex: 2; display: none; }
        .f-item .fi-custom.visible { display: flex; }
        .f-item .fi-unidades { flex: 0 0 70px; }
        .f-item .fi-precio { flex: 1; }
        .f-item .fi-monto {
            flex: 0 0 110px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .f-item .fi-monto .monto-val {
            font-size: 15px;
            font-weight: 700;
            color: #F5A623;
            padding: 10px 0;
        }

        .f-item .fi-col .f-input,
        .f-item .fi-col .f-select {
            padding: 8px 10px;
            font-size: 13px;
        }

        /* Boton eliminar fila */
        .btn-del {
            flex: 0 0 34px;
            height: 34px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }

        .btn-del:hover { background: #c0392b; }

        /* Boton agregar */
        .btn-add {
            background: none;
            border: 1.5px dashed #F5A623;
            color: #F5A623;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
        }

        .btn-add:hover { background: rgba(245,166,35,0.1); }

        /* Subtotal formulario */
        .f-subtotal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 24px;
            padding: 14px 18px;
            background: #222;
            border: 1.5px solid #F5A623;
            border-radius: 10px;
        }

        .f-subtotal span:first-child {
            font-weight: 700;
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #subtotalDisplay {
            font-size: 22px;
            font-weight: 700;
            color: #F5A623;
        }

        /* Boton generar */
        .btn-gen {
            display: block;
            width: 100%;
            padding: 15px;
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-gen:hover { background: #e09510; }

        /* ============================================================
           RECIBO (oculto en pantalla)
           ============================================================ */
        #recibo { display: none; }

        .r-page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: #fff;
            color: #000;
            font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* --- Header: gris con logo izquierda --- */
        .r-header {
            background: #EBEBEB;
            padding: 30px 40px;
        }

        .r-header img {
            height: 90px;
            display: block;
            object-fit: contain;
        }

        /* --- Separador doble: negro corto + naranja largo --- */
        .r-sep {
            display: flex;
            height: 3px;
        }

        .r-sep-black {
            width: 80px;
            background: #000;
            flex-shrink: 0;
        }

        .r-sep-orange {
            flex: 1;
            background: #F5A623;
        }

        /* --- Datos: Invoice Date / Invoice To --- */
        .r-info {
            display: flex;
            justify-content: space-between;
            padding: 35px 40px;
            background: #fff;
        }

        .r-info-col {}
        .r-info-col.right { text-align: right; }

        .r-info-col .r-label {
            font-size: 14px;
            font-weight: 700;
            color: #000;
            margin-bottom: 5px;
        }

        .r-info-col .r-value {
            font-size: 13px;
            color: #333;
        }

        /* --- Tabla --- */
        .r-table-wrap { padding: 0 40px; }

        .r-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .r-table col.col-desc { width: 65%; }
        .r-table col.col-status { width: 35%; }

        .r-table thead th {
            background: #F5A623;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            padding: 12px 15px;
            letter-spacing: 0.4px;
        }

        .r-table thead th:first-child { text-align: left; }
        .r-table thead th:last-child { text-align: right; }

        .r-table tbody td {
            padding: 0 15px;
            height: 45px;
            font-size: 13px;
            color: #222;
            border-bottom: 1px solid #CCC;
            background: #fff;
            vertical-align: middle;
        }

        .r-table tbody td:first-child { text-align: left; }
        .r-table tbody td:last-child { text-align: right; }

        .r-table tfoot td {
            background: #F5A623;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            padding: 12px 15px;
            letter-spacing: 0.4px;
        }

        .r-table tfoot td:first-child { text-align: left; }
        .r-table tfoot td:last-child { text-align: right; }

        /* --- Filas extra debajo del subtotal (remaining, credit balance) --- */
        .r-extra-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            height: 45px;
            border-bottom: 1px solid #CCC;
            background: #fff;
            font-size: 13px;
            color: #222;
        }

        .r-extra-row .r-extra-label {
            font-weight: 700;
            text-transform: uppercase;
        }

        .r-extra-row .r-extra-value {
            font-weight: 700;
        }

        /* --- Espacio blanco --- */
        .r-spacer { height: 120px; }

        /* --- Footer: logo grande centrado, fondo blanco --- */
        .r-footer {
            text-align: center;
            padding: 30px 40px;
            background: #fff;
        }

        .r-footer img {
            width: 320px;
            display: inline-block;
            object-fit: contain;
        }

        /* --- Barra final naranja --- */
        .r-bar {
            height: 18px;
            background: #F5A623;
            margin-top: auto;
        }

        /* ============================================================
           @media print
           ============================================================ */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body {
                background: #fff;
                margin: 0;
                padding: 0;
                width: 210mm;
                min-height: 297mm;
            }

            #formulario { display: none !important; }

            #recibo {
                display: block !important;
                width: 100%;
            }

            .r-page {
                width: 100%;
                min-height: 297mm;
            }

            .r-table { page-break-inside: avoid; }
            .r-footer { page-break-inside: avoid; }

            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================
         FORMULARIO (visible en pantalla, oculto al imprimir)
         ================================================================ -->
    <div id="formulario">
        <h1>Coinbox Mining &mdash; Generador de Recibos</h1>

        <!-- Fecha + Nombre -->
        <div class="f-row">
            <div class="f-col">
                <label class="f-label" for="fDate">Fecha</label>
                <input type="date" id="fDate" class="f-input">
            </div>
            <div class="f-col">
                <label class="f-label" for="fName">Nombre del Cliente</label>
                <input type="text" id="fName" class="f-input" placeholder="Nombre completo">
            </div>
        </div>

        <!-- Tipo de pago -->
        <div style="margin-bottom: 6px;">
            <label class="f-label">Tipo de Pago</label>
        </div>
        <div class="f-radios">
            <label><input type="radio" name="payType" value="full" checked> Full Payment</label>
            <label><input type="radio" name="payType" value="deposit"> Deposit</label>
        </div>

        <!-- Items -->
        <div class="f-items-title">
            <span>Equipos</span>
            <button class="btn-add" id="btnAdd">+ Agregar equipo</button>
        </div>

        <div id="itemsContainer"></div>

        <!-- Subtotal -->
        <div class="f-subtotal">
            <span>Subtotal</span>
            <span id="subtotalDisplay">$0 USD</span>
        </div>

        <!-- Remaining Balance (opcional) -->
        <div style="margin-bottom: 22px;">
            <label class="f-label" for="fRemaining">Remaining Balance (optional)</label>
            <input type="number" id="fRemaining" class="f-input" placeholder="0" min="0">
        </div>

        <!-- Credit Balance (opcional) -->
        <div style="margin-bottom: 22px;">
            <label class="f-label" for="fCredit">Credit Balance (opcional)</label>
            <input type="number" id="fCredit" class="f-input" placeholder="Credit balance (optional)" min="0">
        </div>

        <!-- Generar -->
        <button class="btn-gen" id="btnGen">Generar PDF</button>
    </div>

    <!-- ================================================================
         RECIBO (oculto en pantalla, visible al imprimir)
         ================================================================ -->
    <div id="recibo">
        <div class="r-page">

            <!-- Header gris + logo izquierda -->
            <div class="r-header">
                <img id="logoSmall" src="logo.png" alt="Coinbox Mining">
            </div>

            <!-- Separador 1: negro corto + naranja largo -->
            <div class="r-sep">
                <div class="r-sep-black"></div>
                <div class="r-sep-orange"></div>
            </div>

            <!-- Datos -->
            <div class="r-info">
                <div class="r-info-col">
                    <div class="r-label">Invoice Date :</div>
                    <div class="r-value" id="rDate"></div>
                </div>
                <div class="r-info-col right">
                    <div class="r-label">Invoice To :</div>
                    <div class="r-value" id="rTo"></div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="r-table-wrap">
                <table class="r-table">
                    <colgroup>
                        <col class="col-desc">
                        <col class="col-status">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>Item Description</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="rItems"></tbody>
                    <tfoot>
                        <tr>
                            <td>Subtotal :</td>
                            <td id="rSubtotal"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- Filas extra condicionales (dentro del padding de la tabla) -->
            <div class="r-table-wrap">
                <div id="rRemainingRow" class="r-extra-row" style="display:none;">
                    <span class="r-extra-label">Remaining Balance :</span>
                    <span class="r-extra-value" id="rRemaining"></span>
                </div>
                <div id="rCreditRow" class="r-extra-row" style="display:none;">
                    <span class="r-extra-label">Credit Balance :</span>
                    <span class="r-extra-value" id="rCredit"></span>
                </div>
            </div>

            <!-- Espacio blanco -->
            <div class="r-spacer"></div>

            <!-- Separador 2 -->
            <div class="r-sep">
                <div class="r-sep-black"></div>
                <div class="r-sep-orange"></div>
            </div>

            <!-- Footer: logo grande centrado -->
            <div class="r-footer">
                <img id="logoLarge" src="logo.png" alt="Coinbox Mining">
            </div>

            <!-- Barra final naranja -->
            <div class="r-bar"></div>

        </div>
    </div>

    <!-- ================================================================
         JAVASCRIPT
         ================================================================ -->
    <script>
        /* === Modelos disponibles === */
        var MODELOS = [
            'S21 + 235 TH',
            'S21 HYD 365 TH'
        ];

        /* === Meses en espanol === */
        var MESES = [
            'enero','febrero','marzo','abril','mayo','junio',
            'julio','agosto','septiembre','octubre','noviembre','diciembre'
        ];

        /* Convertir YYYY-MM-DD a "8 de marzo de 2024" */
        function formatDate(iso) {
            var parts = iso.split('-');
            var y = parseInt(parts[0], 10);
            var m = parseInt(parts[1], 10) - 1;
            var d = parseInt(parts[2], 10);
            return d + ' de ' + MESES[m] + ' de ' + y;
        }

        /* Formatear numero como $X,XXX USD */
        function fmtMoney(n) {
            return '$' + n.toLocaleString('en-US') + ' USD';
        }

        /* === Crear fila de item === */
        var itemCounter = 0;

        function createItemRow() {
            itemCounter++;
            var div = document.createElement('div');
            div.className = 'f-item';
            div.dataset.id = itemCounter;

            // Opciones del select de modelos
            var opts = '';
            for (var i = 0; i < MODELOS.length; i++) {
                opts += '<option value="' + MODELOS[i] + '">' + MODELOS[i] + '</option>';
            }
            opts += '<option value="__otro">Otro</option>';

            // Opciones de unidades 1-20
            var uOpts = '';
            for (var u = 1; u <= 20; u++) {
                uOpts += '<option value="' + u + '">' + u + '</option>';
            }

            div.innerHTML =
                '<div class="fi-col fi-modelo">' +
                    '<label>Modelo</label>' +
                    '<select class="f-select sel-modelo">' + opts + '</select>' +
                '</div>' +
                '<div class="fi-col fi-custom">' +
                    '<label>Modelo personalizado</label>' +
                    '<input type="text" class="f-input inp-custom" placeholder="Ej: T21 + 190 TH">' +
                '</div>' +
                '<div class="fi-col fi-unidades">' +
                    '<label>Uds.</label>' +
                    '<select class="f-select sel-uds">' + uOpts + '</select>' +
                '</div>' +
                '<div class="fi-col fi-precio">' +
                    '<label>Precio USD</label>' +
                    '<input type="number" class="f-input inp-precio" placeholder="0" min="0">' +
                '</div>' +
                '<div class="fi-col fi-monto">' +
                    '<label>Monto</label>' +
                    '<div class="monto-val">$0 USD</div>' +
                '</div>' +
                '<button class="btn-del" title="Eliminar">&times;</button>';

            // Eventos
            var selModelo = div.querySelector('.sel-modelo');
            var customWrap = div.querySelector('.fi-custom');
            selModelo.addEventListener('change', function() {
                if (this.value === '__otro') {
                    customWrap.classList.add('visible');
                } else {
                    customWrap.classList.remove('visible');
                }
            });

            div.querySelector('.sel-uds').addEventListener('change', function() { updateRowMonto(div); });
            div.querySelector('.inp-precio').addEventListener('input', function() { updateRowMonto(div); });

            div.querySelector('.btn-del').addEventListener('click', function() {
                var container = document.getElementById('itemsContainer');
                if (container.children.length > 1) {
                    div.remove();
                    recalcSubtotal();
                }
            });

            return div;
        }

        /* Actualizar monto de una fila */
        function updateRowMonto(row) {
            var uds = parseInt(row.querySelector('.sel-uds').value, 10) || 0;
            var precio = parseFloat(row.querySelector('.inp-precio').value) || 0;
            var monto = uds * precio;
            row.querySelector('.monto-val').textContent = fmtMoney(monto);
            recalcSubtotal();
        }

        /* Recalcular subtotal */
        function recalcSubtotal() {
            var rows = document.querySelectorAll('.f-item');
            var total = 0;
            rows.forEach(function(row) {
                var uds = parseInt(row.querySelector('.sel-uds').value, 10) || 0;
                var precio = parseFloat(row.querySelector('.inp-precio').value) || 0;
                total += uds * precio;
            });
            document.getElementById('subtotalDisplay').textContent = fmtMoney(total);
        }

        /* Agregar primera fila */
        document.getElementById('itemsContainer').appendChild(createItemRow());

        /* Boton agregar */
        document.getElementById('btnAdd').addEventListener('click', function() {
            document.getElementById('itemsContainer').appendChild(createItemRow());
        });

        /* === Validacion === */
        function validate() {
            var ok = true;
            var msgs = [];
            var dateEl = document.getElementById('fDate');
            var nameEl = document.getElementById('fName');

            // Limpiar errores
            document.querySelectorAll('.error').forEach(function(el) { el.classList.remove('error'); });

            if (!dateEl.value) {
                dateEl.classList.add('error');
                msgs.push('Selecciona una fecha');
                ok = false;
            }

            if (!nameEl.value.trim()) {
                nameEl.classList.add('error');
                msgs.push('Ingresa el nombre del cliente');
                ok = false;
            }

            // Al menos 1 item con modelo y precio
            var rows = document.querySelectorAll('.f-item');
            var hasValidItem = false;
            rows.forEach(function(row) {
                var modelo = row.querySelector('.sel-modelo').value;
                var precio = parseFloat(row.querySelector('.inp-precio').value) || 0;
                if (modelo === '__otro') {
                    var custom = row.querySelector('.inp-custom').value.trim();
                    if (custom && precio > 0) hasValidItem = true;
                } else {
                    if (precio > 0) hasValidItem = true;
                }
            });

            if (!hasValidItem) {
                msgs.push('Agrega al menos 1 equipo con modelo y precio');
                ok = false;
            }

            if (!ok) alert(msgs.join('\n'));
            return ok;
        }

        /* === Generar recibo y llamar window.print() === */
        document.getElementById('btnGen').addEventListener('click', function() {
            if (!validate()) return;

            // Fecha en espanol
            document.getElementById('rDate').textContent = formatDate(document.getElementById('fDate').value);

            // Nombre
            document.getElementById('rTo').textContent = document.getElementById('fName').value.trim();

            // Armar filas de la tabla
            var tbody = document.getElementById('rItems');
            tbody.innerHTML = '';

            var rows = document.querySelectorAll('.f-item');
            var items = [];
            var subtotal = 0;

            rows.forEach(function(row) {
                var modelo = row.querySelector('.sel-modelo').value;
                if (modelo === '__otro') {
                    modelo = row.querySelector('.inp-custom').value.trim() || 'Otro';
                }
                var uds = parseInt(row.querySelector('.sel-uds').value, 10) || 0;
                var precio = parseFloat(row.querySelector('.inp-precio').value) || 0;
                var monto = uds * precio;

                if (monto > 0) {
                    items.push({
                        desc: uds + 'x ' + modelo,
                        monto: monto
                    });
                    subtotal += monto;
                }
            });

            // Siempre 4 filas (rellenar vacias)
            var totalRows = Math.max(4, items.length);
            for (var i = 0; i < totalRows; i++) {
                var tr = document.createElement('tr');
                var tdDesc = document.createElement('td');
                var tdMonto = document.createElement('td');

                if (i < items.length) {
                    tdDesc.textContent = items[i].desc;
                    tdMonto.textContent = fmtMoney(items[i].monto);
                } else {
                    tdDesc.innerHTML = '&nbsp;';
                    tdMonto.innerHTML = '&nbsp;';
                }

                tr.appendChild(tdDesc);
                tr.appendChild(tdMonto);
                tbody.appendChild(tr);
            }

            // Subtotal label segun tipo de pago
            var payType = document.querySelector('input[name="payType"]:checked').value;
            var subtotalLabelEl = document.querySelector('.r-table tfoot td:first-child');
            subtotalLabelEl.textContent = payType === 'deposit' ? 'Deposit Payment :' : 'Subtotal :';

            // Subtotal monto
            document.getElementById('rSubtotal').textContent = fmtMoney(subtotal);

            // Remaining Balance (opcional)
            var remainingVal = parseFloat(document.getElementById('fRemaining').value) || 0;
            var remainingRow = document.getElementById('rRemainingRow');
            if (remainingVal > 0) {
                document.getElementById('rRemaining').textContent = fmtMoney(remainingVal);
                remainingRow.style.display = 'flex';
            } else {
                remainingRow.style.display = 'none';
            }

            // Credit Balance (opcional)
            var creditVal = parseFloat(document.getElementById('fCredit').value) || 0;
            var creditRow = document.getElementById('rCreditRow');
            if (creditVal > 0) {
                document.getElementById('rCredit').textContent = fmtMoney(creditVal);
                creditRow.style.display = 'flex';
            } else {
                creditRow.style.display = 'none';
            }

            // Titulo para sugerir nombre de archivo
            var clientName = document.getElementById('fName').value.trim().replace(/\s+/g, '_');
            document.title = 'Recibo_Coinbox_' + clientName;

            // Imprimir
            window.print();

            // Restaurar titulo
            document.title = 'Coinbox Mining - Generador de Recibos';
        });
    </script>
</body>
</html>
