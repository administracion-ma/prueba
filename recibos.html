<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinbox Mining - Generador de Recibos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F5F5F5;
            color: #333;
            padding: 40px 20px;
        }

        /* ========== FORMULARIO ========== */
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #F5A623;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        input {
            padding: 10px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus { border-color: #F5A623; }
        input.error { border-color: #e74c3c; }

        .items-section { margin-bottom: 20px; }

        .items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .items-header label { margin-bottom: 0; }

        .item-row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            align-items: center;
        }

        .item-row input:first-child { flex: 2; }
        .item-row input:nth-child(2) { flex: 1; }

        .btn-remove {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-remove:hover { background: #c0392b; }

        .btn-add {
            background: none;
            border: 1.5px dashed #F5A623;
            color: #F5A623;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-add:hover { background: #FFF8EE; }

        .subtotal-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            margin: 16px 0 28px;
            padding: 12px 16px;
            background: #FFF8EE;
            border-radius: 8px;
            border: 1.5px solid #F5A623;
        }

        .subtotal-row span {
            font-weight: 700;
            font-size: 16px;
            color: #F5A623;
        }

        #subtotalDisplay {
            font-size: 20px;
            color: #333;
            font-weight: 700;
        }

        .logo-section {
            margin-bottom: 24px;
            text-align: center;
        }

        .logo-section label {
            display: block;
            margin-bottom: 10px;
        }

        .logo-preview {
            width: 180px;
            height: 80px;
            margin: 0 auto;
            border: 2px dashed #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 13px;
            overflow: hidden;
            background: #fafafa;
        }

        .logo-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-generate {
            display: block;
            width: 100%;
            padding: 14px;
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-generate:hover { background: #e09510; }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* ========== RECIBO (oculto en pantalla, visible al imprimir) ========== */
        #receipt {
            display: none;
        }

        .receipt-page {
            width: 100%;
            max-width: 210mm;
            margin: 0 auto;
            padding: 15mm 20mm;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background: #fff;
        }

        /* Linea decorativa superior */
        .receipt-line-top {
            height: 3px;
            background: #F5A623;
            border-bottom: 1.5px solid #000;
            margin-bottom: 20px;
        }

        /* Logo superior */
        .receipt-logo-top {
            text-align: center;
            margin-bottom: 24px;
        }

        .receipt-logo-top img {
            max-width: 200px;
            max-height: 80px;
            object-fit: contain;
        }

        .receipt-logo-top .placeholder-text {
            font-size: 24px;
            font-weight: 700;
            color: #F5A623;
            letter-spacing: 2px;
        }

        /* Invoice info: dos columnas */
        .receipt-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .receipt-info div { flex: 1; }

        .receipt-info .info-label {
            font-weight: 700;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }

        .receipt-info .info-value {
            font-size: 15px;
            color: #222;
        }

        /* Tabla de items */
        .receipt-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0;
        }

        .receipt-table thead th {
            background: #F5A623;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .receipt-table thead th:first-child { text-align: left; }
        .receipt-table thead th:last-child { text-align: right; }

        .receipt-table tbody td {
            padding: 10px 12px;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }

        .receipt-table tbody td:first-child { text-align: left; }
        .receipt-table tbody td:last-child { text-align: right; }

        .receipt-table tbody tr:nth-child(even) { background: #fafafa; }

        /* Fila subtotal */
        .receipt-table tfoot td {
            background: #F5A623;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            padding: 12px;
        }

        .receipt-table tfoot td:first-child { text-align: left; }
        .receipt-table tfoot td:last-child { text-align: right; }

        /* Logo inferior grande */
        .receipt-logo-bottom {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .receipt-logo-bottom img {
            max-width: 260px;
            max-height: 100px;
            object-fit: contain;
        }

        .receipt-logo-bottom .placeholder-text {
            font-size: 30px;
            font-weight: 700;
            color: #F5A623;
            letter-spacing: 3px;
        }

        /* Linea decorativa inferior */
        .receipt-line-bottom {
            height: 1.5px;
            background: #000;
            border-bottom: 3px solid #F5A623;
        }

        /* ========== @media print ========== */
        @media print {
            /* Ocultar todo el formulario */
            body {
                background: #fff;
                padding: 0;
                margin: 0;
            }

            .container {
                display: none !important;
            }

            /* Mostrar el recibo */
            #receipt {
                display: block !important;
            }

            .receipt-page {
                padding: 10mm 15mm;
                max-width: 100%;
            }

            /* Evitar cortes de pagina en la tabla */
            .receipt-table { page-break-inside: avoid; }
            .receipt-logo-bottom { page-break-inside: avoid; }

            /* Quitar margenes de impresion del navegador */
            @page {
                margin: 5mm;
                size: A4 portrait;
            }

            /* Forzar colores de fondo en impresion */
            .receipt-table thead th,
            .receipt-table tfoot td {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color-adjust: exact;
            }

            .receipt-table tbody tr:nth-child(even) {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color-adjust: exact;
            }

            .receipt-line-top,
            .receipt-line-bottom {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <!-- ========== FORMULARIO (visible en pantalla, oculto al imprimir) ========== -->
    <div class="container">
        <h1>Coinbox Mining</h1>
        <p class="subtitle">Generador de Recibos PDF</p>

        <!-- Logo upload -->
        <div class="logo-section">
            <label>Logo de Coinbox Mining</label>
            <input type="file" id="logoInput" accept="image/*" style="margin-bottom:10px;">
            <div class="logo-preview" id="logoPreview">Sin logo cargado</div>
        </div>

        <!-- Fecha e Invoice To -->
        <div class="form-row">
            <div class="form-group">
                <label for="invoiceDate">Invoice Date</label>
                <input type="text" id="invoiceDate" placeholder="26 de diciembre de 2025">
            </div>
            <div class="form-group">
                <label for="invoiceTo">Invoice To</label>
                <input type="text" id="invoiceTo" placeholder="Nahuel Rausch">
            </div>
        </div>

        <!-- Items -->
        <div class="items-section">
            <div class="items-header">
                <label>Items</label>
                <button class="btn-add" id="btnAdd">+ Agregar Item</button>
            </div>
            <div id="itemsContainer">
                <div class="item-row">
                    <input type="text" class="item-desc" placeholder="Descripcion (ej: S21 + 235 th)">
                    <input type="text" class="item-amount" placeholder="Monto (ej: 5400)">
                    <button class="btn-remove" title="Eliminar" onclick="removeItem(this)">&times;</button>
                </div>
            </div>
        </div>

        <!-- Subtotal -->
        <div class="subtotal-row">
            <span>SUBTOTAL:</span>
            <span id="subtotalDisplay">$0 USD</span>
        </div>

        <!-- Generar PDF -->
        <button class="btn-generate" id="btnGenerate">Generar PDF</button>
        <p class="error-msg" id="errorMsg">Por favor, completa todos los campos antes de generar el recibo.</p>
    </div>

    <!-- ========== RECIBO (oculto en pantalla, visible al imprimir) ========== -->
    <div id="receipt">
        <div class="receipt-page">
            <!-- Linea decorativa superior -->
            <div class="receipt-line-top"></div>

            <!-- Logo superior -->
            <div class="receipt-logo-top" id="receiptLogoTop">
                <span class="placeholder-text">COINBOX MINING</span>
            </div>

            <!-- Invoice Date / Invoice To -->
            <div class="receipt-info">
                <div>
                    <div class="info-label">Invoice Date:</div>
                    <div class="info-value" id="receiptDate"></div>
                </div>
                <div style="text-align: right;">
                    <div class="info-label">Invoice To:</div>
                    <div class="info-value" id="receiptTo"></div>
                </div>
            </div>

            <!-- Tabla de items -->
            <table class="receipt-table">
                <thead>
                    <tr>
                        <th>Item Description</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="receiptItems"></tbody>
                <tfoot>
                    <tr>
                        <td>SUBTOTAL</td>
                        <td id="receiptSubtotal" style="text-align: right;"></td>
                    </tr>
                </tfoot>
            </table>

            <!-- Logo inferior grande -->
            <div class="receipt-logo-bottom" id="receiptLogoBottom">
                <span class="placeholder-text">COINBOX MINING</span>
            </div>

            <!-- Linea decorativa inferior -->
            <div class="receipt-line-bottom"></div>
        </div>
    </div>

    <script>
        // === Estado del logo ===
        let logoDataURL = null;

        // Cargar logo desde archivo
        document.getElementById('logoInput').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                logoDataURL = ev.target.result;
                document.getElementById('logoPreview').innerHTML =
                    '<img src="' + logoDataURL + '" alt="Logo">';
            };
            reader.readAsDataURL(file);
        });

        // === Agregar item ===
        document.getElementById('btnAdd').addEventListener('click', function() {
            var row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML =
                '<input type="text" class="item-desc" placeholder="Descripcion (ej: S21 + 235 th)">' +
                '<input type="text" class="item-amount" placeholder="Monto (ej: 5400)">' +
                '<button class="btn-remove" title="Eliminar" onclick="removeItem(this)">&times;</button>';
            document.getElementById('itemsContainer').appendChild(row);
            recalcSubtotal();
        });

        // Eliminar item (mantener al menos uno)
        function removeItem(btn) {
            var container = document.getElementById('itemsContainer');
            if (container.children.length > 1) {
                btn.parentElement.remove();
                recalcSubtotal();
            }
        }

        // === Recalcular subtotal en tiempo real ===
        function recalcSubtotal() {
            var amounts = document.querySelectorAll('.item-amount');
            var total = 0;
            amounts.forEach(function(input) {
                var val = parseFloat(input.value.replace(/[^0-9.]/g, ''));
                if (!isNaN(val)) total += val;
            });
            document.getElementById('subtotalDisplay').textContent = '$' + total.toLocaleString('en-US') + ' USD';
        }

        // Escuchar cambios en montos
        document.getElementById('itemsContainer').addEventListener('input', function(e) {
            if (e.target.classList.contains('item-amount')) recalcSubtotal();
        });

        // === Validacion ===
        function validateForm() {
            var valid = true;
            var date = document.getElementById('invoiceDate');
            var to = document.getElementById('invoiceTo');
            var descs = document.querySelectorAll('.item-desc');
            var amounts = document.querySelectorAll('.item-amount');

            document.querySelectorAll('input').forEach(function(i) { i.classList.remove('error'); });

            if (!date.value.trim()) { date.classList.add('error'); valid = false; }
            if (!to.value.trim()) { to.classList.add('error'); valid = false; }

            descs.forEach(function(d) {
                if (!d.value.trim()) { d.classList.add('error'); valid = false; }
            });
            amounts.forEach(function(a) {
                var val = parseFloat(a.value.replace(/[^0-9.]/g, ''));
                if (!a.value.trim() || isNaN(val)) { a.classList.add('error'); valid = false; }
            });

            document.getElementById('errorMsg').style.display = valid ? 'none' : 'block';
            return valid;
        }

        // === Armar recibo y llamar window.print() ===
        document.getElementById('btnGenerate').addEventListener('click', function() {
            if (!validateForm()) return;

            // Poblar datos del recibo
            document.getElementById('receiptDate').textContent = document.getElementById('invoiceDate').value.trim();
            document.getElementById('receiptTo').textContent = document.getElementById('invoiceTo').value.trim();

            // Logo superior
            var logoTopEl = document.getElementById('receiptLogoTop');
            if (logoDataURL) {
                logoTopEl.innerHTML = '<img src="' + logoDataURL + '" alt="Coinbox Mining">';
            } else {
                logoTopEl.innerHTML = '<span class="placeholder-text">COINBOX MINING</span>';
            }

            // Logo inferior
            var logoBottomEl = document.getElementById('receiptLogoBottom');
            if (logoDataURL) {
                logoBottomEl.innerHTML = '<img src="' + logoDataURL + '" alt="Coinbox Mining">';
            } else {
                logoBottomEl.innerHTML = '<span class="placeholder-text">COINBOX MINING</span>';
            }

            // Armar filas de items
            var descs = document.querySelectorAll('.item-desc');
            var amounts = document.querySelectorAll('.item-amount');
            var tbody = document.getElementById('receiptItems');
            tbody.innerHTML = '';
            var subtotal = 0;

            for (var i = 0; i < descs.length; i++) {
                var desc = descs[i].value.trim();
                var rawAmount = parseFloat(amounts[i].value.replace(/[^0-9.]/g, ''));
                subtotal += rawAmount;
                var amountStr = '$' + rawAmount.toLocaleString('en-US') + ' USD';

                var tr = document.createElement('tr');
                var tdDesc = document.createElement('td');
                tdDesc.textContent = desc;
                var tdAmount = document.createElement('td');
                tdAmount.textContent = amountStr;
                tdAmount.style.textAlign = 'right';
                tr.appendChild(tdDesc);
                tr.appendChild(tdAmount);
                tbody.appendChild(tr);
            }

            // Subtotal
            document.getElementById('receiptSubtotal').textContent = '$' + subtotal.toLocaleString('en-US') + ' USD';

            // Cambiar titulo del documento para sugerir nombre del archivo PDF
            var clientName = document.getElementById('invoiceTo').value.trim().replace(/\s+/g, '_');
            var dateStr = document.getElementById('invoiceDate').value.trim().replace(/\s+/g, '_');
            document.title = 'Recibo_Coinbox_' + clientName + '_' + dateStr;

            // Imprimir
            window.print();

            // Restaurar titulo
            document.title = 'Coinbox Mining - Generador de Recibos';
        });
    </script>
</body>
</html>
